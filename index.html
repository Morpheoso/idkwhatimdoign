<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Morpheoso's animated pipe screen saver and website menu.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#050609">
  <title>Morpheoso</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --hello-rainbow: linear-gradient(90deg, #ff5f6d, #ffca5c, #72f1b8, #58c7ff, #c084fc, #ff5fbd, #ff5f6d);
      background: #050609;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: block;
      padding: 0;
      overflow: hidden;
      background: #050609;
      isolation: isolate;
    }
    #pipe-saver {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      touch-action: pan-x pinch-zoom;
    }
    .top-menu {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 5;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .menu-toggle {
      display: grid;
      width: 46px;
      height: 44px;
      align-content: center;
      justify-items: center;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: 3px;
      background:
        linear-gradient(rgb(7 13 11 / 94%), rgb(7 13 11 / 94%)) padding-box,
        var(--hello-rainbow) border-box;
      background-size: 100% 100%, 300% 100%;
      animation: rainbow-border-shift 9s linear infinite;
      box-shadow: 0 0 14px rgb(185 112 255 / 18%);
      cursor: pointer;
    }
    .menu-toggle span {
      display: block;
      width: 19px;
      height: 2px;
      border-radius: 2px;
      background: var(--hello-rainbow);
      background-size: 300% 100%;
      animation: rainbow-shift 9s linear infinite;
      transition: transform 160ms ease, opacity 160ms ease;
    }
    .menu-toggle[aria-expanded="true"] span:first-child {
      transform: translateY(7px) rotate(45deg);
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:last-child {
      transform: translateY(-7px) rotate(-45deg);
    }
    .menu-toggle:focus-visible,
    .terminal-menu a:focus-visible {
      outline: 2px solid #a6ffd9;
      outline-offset: 3px;
    }
    .terminal-menu {
      position: absolute;
      top: 54px;
      right: 0;
      width: 184px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      background:
        linear-gradient(rgb(7 13 11 / 97%), rgb(7 13 11 / 97%)) padding-box,
        var(--hello-rainbow) border-box;
      background-size: 100% 100%, 300% 100%;
      animation: rainbow-border-shift 9s linear infinite;
      box-shadow: 0 0 20px rgb(185 112 255 / 16%), 0 14px 36px rgb(0 0 0 / 55%);
    }
    .terminal-menu[hidden] { display: none; }
    .terminal-menu a {
      display: flex;
      min-height: 44px;
      align-items: center;
      padding: 0 12px;
      color: #a6ffd9;
      font-size: 14px;
      letter-spacing: .04em;
      text-decoration: none;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .terminal-menu a + a { border-top: 1px dashed rgb(85 239 176 / 28%); }
    .terminal-menu a::before {
      content: ">";
      margin-right: 9px;
      color: #a6ffd9;
    }
    .terminal-menu a:hover {
      background: rgb(85 239 176 / 12%);
      color: #fff;
    }
    @keyframes rainbow-shift {
      from { background-position: 0% 50%; }
      to { background-position: 300% 50%; }
    }
    @keyframes rainbow-border-shift {
      from { background-position: 0 0, 0% 50%; }
      to { background-position: 0 0, 300% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-toggle, .menu-toggle span, .terminal-menu { animation: none; }
      .menu-toggle span, .terminal-menu a { transition: none; }
    }
    @media (max-width: 480px) {
      .top-menu { top: 14px; right: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="pipe-saver" aria-hidden="true"></canvas>
  <div class="top-menu">
    <button
      class="menu-toggle"
      id="menu-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="site-menu"
    >
      <span></span><span></span><span></span>
    </button>
    <nav class="terminal-menu" id="site-menu" aria-label="Main navigation" hidden>
      <a href="weather.html">Weather</a>
      <a href="audio-visualizer.html">Audio Visualizer</a>
      <a href="bigfoot-runner.html">Bigfoot Runner</a>
    </nav>
  </div>
  <script>
    (() => {
      const menuArea = document.querySelector(".top-menu");
      const menuButton = document.getElementById("menu-toggle");
      const menu = document.getElementById("site-menu");

      function setMenuOpen(open) {
        menu.hidden = !open;
        menuButton.setAttribute("aria-expanded", String(open));
        menuButton.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
      }

      menuButton.addEventListener("click", () => setMenuOpen(menu.hidden));
      menu.addEventListener("click", event => {
        if (event.target.closest("a")) setMenuOpen(false);
      });
      document.addEventListener("click", event => {
        if (!menuArea.contains(event.target)) setMenuOpen(false);
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !menu.hidden) {
          setMenuOpen(false);
          menuButton.focus();
        }
      });
    })();
  </script>
  <script>
    (() => {
      const canvas = document.getElementById("pipe-saver");
      const context = canvas.getContext("2d");
      if (!context) return;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const axes = [
        { x: 1, y: 0, z: 0 }, { x: -1, y: 0, z: 0 },
        { x: 0, y: 1, z: 0 }, { x: 0, y: -1, z: 0 },
        { x: 0, y: 0, z: 1 }, { x: 0, y: 0, z: -1 }
      ];
      const colors = ["#ff5f6d", "#ffbf4a", "#ffe66d", "#69e6a6", "#51c7ff", "#9b8cff", "#ed78e8"];
      const pipeCount = 14;
      const puzzleDuration = 60_000;
      let pipes = [];
      let width = 0;
      let height = 0;
      let unit = 24;
      let gridLimit = 8;
      let zoom = 1;
      let frameId;
      let lastStep = 0;
      let puzzleStarted = 0;

      function project(point) {
        const scaledUnit = unit * zoom;
        return {
          x: width / 2 + (point.x - point.y) * scaledUnit * 0.866,
          y: height / 2 + (point.x + point.y) * scaledUnit * 0.5 - point.z * scaledUnit * 0.9
        };
      }

      function changeZoom(factor) {
        zoom = Math.max(0.14, Math.min(2.5, zoom * factor));
        draw();
      }

      function isInside(point) {
        return Math.abs(point.x) <= gridLimit && Math.abs(point.y) <= gridLimit && Math.abs(point.z) <= gridLimit;
      }

      function chooseDirection(point, previous) {
        const valid = axes.filter(axis => isInside({ x: point.x + axis.x, y: point.y + axis.y, z: point.z + axis.z }));
        const perpendicular = valid.filter(axis =>
          axis.x * previous.x + axis.y * previous.y + axis.z * previous.z === 0
        );
        const choices = perpendicular.length ? perpendicular : valid;
        return choices[Math.floor(Math.random() * choices.length)];
      }

      function newPipe(seed = false) {
        const span = Math.max(3, gridLimit - 1);
        const point = seed
          ? { x: (Math.random() - 0.5) * span, y: (Math.random() - 0.5) * span, z: (Math.random() - 0.5) * span }
          : { x: 0, y: 0, z: 0 };
        const direction = axes[Math.floor(Math.random() * axes.length)];
        const pipe = {
          points: [point],
          direction,
          stepsLeft: 8 + Math.floor(Math.random() * 13),
          hue: colors[Math.floor(Math.random() * colors.length)]
        };
        if (seed) {
          for (let i = 0; i < 90; i += 1) stepPipe(pipe);
        }
        return pipe;
      }

      function stepPipe(pipe) {
        if (pipe.stepsLeft <= 0) {
          pipe.direction = chooseDirection(pipe.points[pipe.points.length - 1], pipe.direction);
          pipe.stepsLeft = 8 + Math.floor(Math.random() * 13);
        }
        const last = pipe.points[pipe.points.length - 1];
        let next = {
          x: last.x + pipe.direction.x,
          y: last.y + pipe.direction.y,
          z: last.z + pipe.direction.z
        };
        if (!isInside(next)) {
          pipe.direction = chooseDirection(last, pipe.direction);
          pipe.stepsLeft = 8 + Math.floor(Math.random() * 13);
          next = {
            x: last.x + pipe.direction.x,
            y: last.y + pipe.direction.y,
            z: last.z + pipe.direction.z
          };
        }
        pipe.points.push(next);
        pipe.stepsLeft -= 1;
      }

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        unit = Math.max(16, Math.min(30, Math.min(width / 34, height / 24)));
        gridLimit = Math.max(4, Math.floor(Math.min(width / (3.8 * unit), height / (3.8 * unit))));
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (!pipes.length) {
          pipes = Array.from({ length: pipeCount }, () => newPipe(true));
          puzzleStarted = performance.now();
        }
        draw();
      }

      function drawPipe(pipe) {
        const points = pipe.points.map(project);
        if (points.length < 2) return;

        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) context.lineTo(points[i].x, points[i].y);
        context.lineJoin = "round";
        context.lineCap = "round";
        context.strokeStyle = "#08090d";
        context.lineWidth = Math.max(2, 21 * zoom);
        context.stroke();
        context.strokeStyle = pipe.hue;
        context.lineWidth = Math.max(1.5, 15 * zoom);
        context.shadowColor = pipe.hue;
        context.shadowBlur = 12 * zoom;
        context.stroke();
        context.shadowBlur = 0;

        for (let i = 1; i < points.length; i += 1) {
          const a = points[i - 1];
          const b = points[i];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const length = Math.hypot(dx, dy) || 1;
          const offsetX = (dy / length) * -3 * zoom;
          const offsetY = (dx / length) * 3 * zoom;
          context.beginPath();
          context.moveTo(a.x + offsetX, a.y + offsetY);
          context.lineTo(b.x + offsetX, b.y + offsetY);
          context.strokeStyle = "rgb(255 255 255 / 42%)";
          context.lineWidth = Math.max(0.6, 2 * zoom);
          context.lineCap = "round";
          context.stroke();
        }
      }

      function draw() {
        context.fillStyle = "#050609";
        context.fillRect(0, 0, width, height);
        for (const pipe of pipes) drawPipe(pipe);
      }

      function animate(now) {
        if (now - lastStep > 115) {
          if (now - puzzleStarted >= puzzleDuration) {
            pipes = Array.from({ length: pipeCount }, () => newPipe(true));
            puzzleStarted = now;
          }
          for (const pipe of pipes) {
            stepPipe(pipe);
          }
          lastStep = now;
          draw();
        }
        frameId = window.requestAnimationFrame(animate);
      }

      function start() {
        if (frameId) window.cancelAnimationFrame(frameId);
        resize();
        if (!reducedMotion.matches) frameId = window.requestAnimationFrame(animate);
      }

      window.addEventListener("resize", start, { passive: true });
      reducedMotion.addEventListener?.("change", start);
      window.addEventListener("wheel", event => {
        if (event.ctrlKey || event.metaKey) return;
        event.preventDefault();
        changeZoom(Math.exp(-event.deltaY * 0.0015));
      }, { passive: false });
      let activeTouchPointer = null;
      let lastTouchY = 0;
      canvas.addEventListener("pointerdown", event => {
        if (event.pointerType !== "touch") return;
        activeTouchPointer = event.pointerId;
        lastTouchY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", event => {
        if (event.pointerType !== "touch" || event.pointerId !== activeTouchPointer) return;
        const deltaY = event.clientY - lastTouchY;
        lastTouchY = event.clientY;
        if (Math.abs(deltaY) > 0.5) changeZoom(Math.exp(deltaY * 0.0018));
      });
      function endTouchZoom(event) {
        if (event.pointerId === activeTouchPointer) activeTouchPointer = null;
      }
      canvas.addEventListener("pointerup", endTouchZoom);
      canvas.addEventListener("pointercancel", endTouchZoom);
      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.code === "PageDown") {
          event.preventDefault();
          changeZoom(0.72);
        } else if (event.code === "PageUp") {
          event.preventDefault();
          changeZoom(1.39);
        }
      });
      start();
    })();
  </script>
</body>
</html>
