<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A warm welcome to my website.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Welcome to My Website</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 72px);
      text-align: center;
      background: #fff;
      border: 1px solid #e3e9f2;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgb(31 52 84 / 9%);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #526b9a;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }
    .message {
      margin: 20px 0 0;
      color: #596579;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little corner of the internet</p>
    <h1>Hello!</h1>
    <p class="message">Welcome to my website.</p>
  </main>
</body>
</html>
