<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A warm welcome to my website.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#050609">
  <title>Welcome to My Website</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050609;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #050609;
      isolation: isolate;
    }
    #matrix-rain {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 72px);
      text-align: center;
      background: rgb(8 10 18 / 76%);
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 24px;
      box-shadow: 0 18px 70px rgb(0 0 0 / 55%), 0 0 45px rgb(79 70 229 / 12%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .eyebrow {
      margin: 0 0 16px;
      color: #e5e7eb;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      display: inline-block;
      margin: 0;
      background: linear-gradient(90deg, #ff5f6d, #ffca5c, #72f1b8, #58c7ff, #c084fc, #ff5fbd, #ff5f6d);
      background-size: 300% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(2.75rem, 10vw, 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.055em;
      animation: rainbow-shift 9s linear infinite;
      filter: drop-shadow(0 0 18px rgb(185 112 255 / 20%));
    }
    .message {
      margin: 22px 0 0;
      background: linear-gradient(90deg, #ff9cba, #ffe58a, #9bffd6, #9be2ff, #d5a6ff, #ff9cba);
      background-size: 250% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 600;
      line-height: 1.6;
      animation: rainbow-shift 12s linear infinite reverse;
      filter: drop-shadow(0 1px 8px rgb(0 0 0 / 90%));
    }
    @keyframes rainbow-shift {
      from { background-position: 0% 50%; }
      to { background-position: 300% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1, .message { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain" aria-hidden="true"></canvas>
  <main>
    <p class="eyebrow">A little corner of the internet</p>
    <h1>Hello!</h1>
    <p class="message">Welcome to my website.</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById("matrix-rain");
      const context = canvas.getContext("2d");
      if (!context) return;

      const symbols = "アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*/=%<>";
      const fontSize = 17;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let columns = [];
      let width = 0;
      let height = 0;
      let frameId;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        columns = Array.from({ length: Math.ceil(width / fontSize) }, () => ({
          y: Math.random() * (height / fontSize),
          speed: 0.35 + Math.random() * 0.8
        }));
        context.fillStyle = "#050609";
        context.fillRect(0, 0, width, height);
        if (reducedMotion.matches) drawStill();
      }

      function drawSymbol(column, y, alpha = 0.8) {
        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
        const hue = Math.floor(Math.random() * 360);
        context.fillStyle = `hsla(${hue}, 92%, 68%, ${alpha})`;
        context.fillText(symbol, column * fontSize, y * fontSize);
      }

      function drawStill() {
        context.font = `${fontSize}px monospace`;
        for (let column = 0; column < columns.length; column += 1) {
          const count = 4 + Math.floor(Math.random() * 8);
          const start = Math.floor(Math.random() * Math.max(1, height / fontSize));
          for (let trail = 0; trail < count; trail += 1) {
            drawSymbol(column, start - trail, 0.22 + (1 - trail / count) * 0.48);
          }
        }
      }

      function animate() {
        context.fillStyle = "rgba(5, 6, 9, 0.12)";
        context.fillRect(0, 0, width, height);
        context.font = `${fontSize}px monospace`;

        for (let column = 0; column < columns.length; column += 1) {
          const drop = columns[column];
          drawSymbol(column, drop.y, 0.78);
          drop.y += drop.speed;
          if (drop.y * fontSize > height && Math.random() > 0.975) {
            drop.y = -Math.random() * 20;
            drop.speed = 0.35 + Math.random() * 0.8;
          }
        }
        frameId = window.requestAnimationFrame(animate);
      }

      function start() {
        if (frameId) window.cancelAnimationFrame(frameId);
        resize();
        if (!reducedMotion.matches) frameId = window.requestAnimationFrame(animate);
      }

      window.addEventListener("resize", start, { passive: true });
      reducedMotion.addEventListener?.("change", start);
      start();
    })();
  </script>
</body>
</html>
