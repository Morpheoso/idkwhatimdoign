<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A warm welcome to my website.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#050609">
  <title>Welcome to My Website</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050609;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #050609;
      isolation: isolate;
    }
    #matrix-rain {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 72px);
      text-align: center;
      background: rgb(8 10 18 / 76%);
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 24px;
      box-shadow: 0 18px 70px rgb(0 0 0 / 55%), 0 0 45px rgb(79 70 229 / 12%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .eyebrow {
      margin: 0 0 16px;
      color: #e5e7eb;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      display: inline-block;
      margin: 0;
      background: linear-gradient(90deg, #ff5f6d, #ffca5c, #72f1b8, #58c7ff, #c084fc, #ff5fbd, #ff5f6d);
      background-size: 300% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(2.75rem, 10vw, 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.055em;
      animation: rainbow-shift 9s linear infinite;
      filter: drop-shadow(0 0 18px rgb(185 112 255 / 20%));
    }
    .message {
      margin: 22px 0 0;
      background: linear-gradient(90deg, #ff9cba, #ffe58a, #9bffd6, #9be2ff, #d5a6ff, #ff9cba);
      background-size: 250% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 600;
      line-height: 1.6;
      animation: rainbow-shift 12s linear infinite reverse;
      filter: drop-shadow(0 1px 8px rgb(0 0 0 / 90%));
    }
    @keyframes rainbow-shift {
      from { background-position: 0% 50%; }
      to { background-position: 300% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1, .message { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain" aria-hidden="true"></canvas>
  <main>
    <p class="eyebrow">A little corner of the internet</p>
